# Pipeline CI del corso — esegue i test Cypress in automatico su GitHub.
# Ogni riga è commentata: è lo stesso file che i partecipanti scrivono nel laboratorio CI/CD.
#test

name: CI Cypress                       # nome che comparirà nella tab "Actions" di GitHub

on:                                   # QUANDO deve partire la pipeline (i "trigger")
  push:                               # a ogni push (anche sui branch): girano i component test (feedback rapido)
  pull_request:
    branches: [main]                  # PR verso main: girano anche gli E2E (verifica PRIMA del merge)

jobs:                                 # un workflow contiene uno o più "job" (gruppi di passi)

  component:                          # JOB 1 — i test di componente, leggeri: li facciamo girare sempre
    runs-on: ubuntu-latest            # il "runner": una macchina Linux pulita fornita da GitHub
    steps:                            # i passi eseguiti in sequenza dentro al job
      - uses: actions/checkout@v4     # 1. scarica il codice del repo nel runner
      - uses: actions/setup-node@v4   # 2. installa Node.js
        with:
          node-version: 20
          cache: npm                  #    usa la cache di npm per essere più veloce
      - run: npm ci                   # 3. installa le dipendenze in modo pulito e riproducibile
      - name: Component tests         # 4. esegue SOLO i component test, headless
        run: npx cypress run --component
      - uses: actions/upload-artifact@v4   # 5. se qualcosa va storto, salva gli screenshot come "artifact"
        if: failure()                 #    (solo in caso di fallimento)
        with:
          name: screenshots-component
          path: cypress/screenshots

  e2e:                                # JOB 2 — gli E2E: sulla PR verso main e al merge (push su main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: E2E tests               # cypress-io/github-action avvia l'app e poi lancia gli E2E
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev          # avvia il server di sviluppo (Vite)
          wait-on: 'http://localhost:5173'   # aspetta che l'app risponda prima di testare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: video-e2e
          path: cypress/videos        # i video dei test E2E, utili per capire un fallimento
